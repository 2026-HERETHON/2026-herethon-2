{% load static %}
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/colorpalette.css' %}" />
    <link rel="stylesheet" href="{% static 'css/global.css' %}" />
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
    <title>역할 선택</title>
  </head>
  <body>
    <main class="login-main">
      <div class="logo-wrap">
        <div class="main-logo">
          <img
            class="header-logo-img"
            src="{% static 'img/logo.svg' %}"
            alt="logo"
          />

          <span class="logo-brand"
            ><span class="RE">RE</span><span class="colon">:</span>Bridge</span
          >
        </div>
        <span class="positioning"
          >경력의 공백을 실력으로 잇는 프로젝트 매칭 네트워크</span
        >
      </div>
      <small class="select-desc">아래에서 유형을 선택해주세요</small>

      {% if error %}
      <p style="color: red">{{ error }}</p>
      {% endif %}

      <form method="post" id="role-form">
        {% csrf_token %}
        <input type="hidden" name="role" id="role-input" />
        <section class="select-user-type">
          <a href="#" data-role="WORKER">
            <span>경력자로 시작</span>
            <small>프로젝트를 찾고 있어요</small>
          </a>
          <a href="#" data-role="COMPANY">
            <span>기업으로 시작</span>
            <small>인재를 찾고 있어요</small>
          </a>
        </section>
      </form>
    </main>

    <script>
      const roleForm = document.getElementById('role-form');
      const roleInput = document.getElementById('role-input');
      const roleLinks = document.querySelectorAll('.select-user-type a[data-role]');

      roleLinks.forEach((link) => {
        link.addEventListener('click', (event) => {
          event.preventDefault();
          roleInput.value = link.dataset.role;
          roleForm.submit();
        });
      });
    </script>
  </body>
</html>
