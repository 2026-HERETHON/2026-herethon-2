<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>프로젝트 수정</title>
</head>
<body>
    <a href="{% url 'company:project_progress_detail' project.id %}">← 취소하고 돌아가기</a>

    <h1>프로젝트 수정</h1>
    <p style="color:#888;">진행중인 프로젝트는 제목과 상세 내용만 수정할 수 있어요.</p>

    <form method="post">
        {% csrf_token %}

        <div>
            <label>프로젝트명</label><br>
            <input type="text" name="title" value="{{ project.title }}" required>
        </div>

        <div>
            <label>상세 내용</label><br>
            <textarea name="description" required>{{ project.description }}</textarea>
        </div>

        <button type="submit">저장</button>
    </form>
</body>
</html>
