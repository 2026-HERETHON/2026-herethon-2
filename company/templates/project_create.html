<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공고 등록</title>
    <link rel="stylesheet" href="../../static/css/colorpalette.css" />
    <link rel="stylesheet" href="../../static/css/global.css" />
    <link rel="stylesheet" href="../../static/css/project_create.css" />
  </head>
  <body>
    <!-- 헤더 영역 -->
    <header>
      <div class="header-logo">
        <img
          class="header-logo-img"
          src="../../static/img/logo.svg"
          alt="logo"
        />
        <div class="header-logo-text">
          <span class="logo-desc">당신의 두 번째 커리어 브릿지</span>
          <span class="logo-brand"
            ><span class="RE">RE</span><span class="colon">:</span>Bridge</span
          >
        </div>
      </div>
      <div class="header-profile">
        <!-- TPL:  기업 프로필 이름 -->
        <a>주</a>
      </div>
    </header>

    <!-- 왼쪽 사이드바 -->
    <nav class="sidebar-nav">
      <!-- TPL: href 실제 url 패턴으로 변경 필요 -->
      <!-- TPL: 현재 active 클래스 하드 코딩함. 연동 시 현재 페이지의 active 판단 로직으로 교체 필요  -->
      <a
        href="project_create.html"
        class="nav-menu active"
        data-label="공고 등록"
      >
        공고 등록
      </a>
      <a href="#" class="nav-menu" data-label="프로젝트 관리하기">
        프로젝트 관리하기
      </a>
      <a href="#" class="nav-menu" data-label="기업 정보"> 기업 정보 </a>
    </nav>

    <!-- 공고 등록 영역 -->
    <main class="project_create">
      <form method="post" id="project-create-form">
        <!-- 좌측 메인 폼 영역 -->
        <section class="project-form-left">
          <!-- 기업명 -->
          <div class="form-group">
            <label for="company-name" class="form-label-1">기업명</label>
            <input
              type="text"
              id="company-name"
              name="company_name"
              class="form-input"
              placeholder="기업명을 입력하세요"
              required
            />
          </div>

          <!-- 프로젝트명 -->
          <div class="form-group">
            <label for="project-name" class="form-label-1"
              >새 프로젝트 공고 등록</label
            >
            <input
              type="text"
              id="project-name"
              name="project_name"
              class="form-input"
              placeholder="프로젝트명을 입력하세요"
              required
            />
          </div>

          <!-- 상세 내용 -->
          <div class="form-group">
            <label for="project-detail" class="form-label-2">상세 내용</label>
            <textarea
              id="project-detail"
              class="form-textarea"
              placeholder="프로젝트의 배경, 주요 업무, 협업 방식 등을 자유롭게 적어주세요"
              required
            ></textarea>
          </div>

          <!-- 직무 유형 (단일 선택) -->
          <div class="form-group">
            <label class="form-label-2">직무유형 선택</label>
            <div class="option-btn-group">
              <!-- TPL: job_categories (직무 유형 버튼 반복) -->
              <label class="option-btn">
                <input type="radio" name="work_type" value="job.id" required />
                콘텐츠 기획
              </label>
              <label class="option-btn">
                <input type="radio" name="work_type" value="job.id" required />
                데이터 분석
              </label>
              <label class="option-btn">
                <input type="radio" name="work_type" value="job.id" required />
                디자인
              </label>
              <label class="option-btn">
                <input type="radio" name="work_type" value="job.id" required />
                개발
              </label>
            </div>
          </div>

          <!-- 근무 형태 (단일 선택) -->
          <div class="form-group">
            <label class="form-label-2">근무 형태 선택</label>
            <div class="option-btn-group">
              <!-- TPL:  (근무 형태 버튼 반복) -->
              <label class="option-btn">
                <input type="radio" name="work_style" value="REMOTE" required />
                100% 재택
              </label>
              <label class="option-btn">
                <input
                  type="radio"
                  name="work_style"
                  value="ONSITE_WEEKLY_1"
                  required
                />
                주 1회 출근
              </label>
              <label class="option-btn">
                <input
                  type="radio"
                  name="work_style"
                  value="ONSITE_WEEKLY_3"
                  required
                />
                주 3회 이상 출근
              </label>
              <label class="option-btn">
                <input
                  type="radio"
                  name="work_style"
                  value="ONSITE_DAILY"
                  required
                />
                매일 출근
              </label>
            </div>
          </div>

          <!-- 가용 시간 (단일 선택) -->
          <div class="form-group">
            <label class="form-label-2">가용 시간 (주 0시간)</label>
            <div class="option-btn-group">
              <!-- TPL:  (가용 시간 버튼 반복) -->
              <label class="option-btn">
                <input
                  type="radio"
                  name="weekly_hours"
                  value="UNDER_15"
                  required
                />
                주 15시간 미만
              </label>
              <label class="option-btn">
                <input
                  type="radio"
                  name="weekly_hours"
                  value="FIFTEEN_TO_25"
                  required
                />
                주 15시간~25시간
              </label>
              <label class="option-btn">
                <input
                  type="radio"
                  name="weekly_hours"
                  value="OVER_25"
                  required
                />
                주 25시간 이상
              </label>
            </div>
          </div>

          <!-- 코어 타임 (복수 선택) -->
          <div class="form-group">
            <label class="form-label-2"
              >코어타임 (소통 선호 시간대)<span class="form-label-des"
                >복수 선택 가능</span
              ></label
            >
            <div class="option-btn-group">
              <!-- TPL:  (코어타임 버튼 반복) -->
              <label class="option-btn core-time-btn">
                <input
                  type="checkbox"
                  name="core_times"
                  value="early_morning"
                />
                <span class="core-time-label">이른 아침</span>
                <span class="core-time-range">07:00~10:00</span>
              </label>
              <label class="option-btn core-time-btn">
                <input type="checkbox" name="core_times" value="morning" />
                <span class="core-time-label">오전</span>
                <span class="core-time-range">10:00~14:00</span>
              </label>
              <label class="option-btn core-time-btn">
                <input type="checkbox" name="core_times" value="afternoon" />
                <span class="core-time-label">오후</span>
                <span class="core-time-range">14:00~18:00</span>
              </label>
              <label class="option-btn core-time-btn">
                <input type="checkbox" name="core_times" value="evening" />
                <span class="core-time-label">저녁</span>
                <span class="core-time-range">18:00~22:00</span>
              </label>
            </div>
          </div>

          <!-- 업무 규모 (복수 선택) -->
          <div class="form-group">
            <label class="form-label-2"
              >업무 규모
              <span class="form-label-des">복수 선택 가능</span></label
            >
            <div class="option-btn-group">
              <!-- TPL:  (업무 규모 버튼 반복) -->
              <label class="option-btn">
                <input type="checkbox" name="preferred_scales" value="SHORT" />
                1~2주 단기
              </label>
              <label class="option-btn">
                <input type="checkbox" name="preferred_scales" value="LONG" />
                1개월 이상 중기
              </label>
              <label class="option-btn">
                <input
                  type="checkbox"
                  name="preferred_scales"
                  value="REGULAR_TRANSITION"
                />
                정규직 전환 전제 (리턴십)
              </label>
            </div>
          </div>

          <!-- 경력 연차 -->
          <div class="form-group">
            <label class="form-label-2">경력 연차</label>
            <div class="option-btn-group">
              <!-- TPL:  (경력 연차 버튼 반복) -->
              <label class="option-btn"
                ><input
                  type="radio"
                  name="career_years"
                  value="ONE_TO_THREE"
                  required
                />
                1~3년</label
              >
              <label class="option-btn"
                ><input
                  type="radio"
                  name="career_years"
                  value="THREE_TO_FIVE"
                  required
                />
                3~5년</label
              >
              <label class="option-btn"
                ><input
                  type="radio"
                  name="career_years"
                  value="FIVE_TO_SEVEN"
                  required
                />
                5~7년</label
              >
              <label class="option-btn"
                ><input
                  type="radio"
                  name="career_years"
                  value="OVER_SEVEN"
                  required
                />7년 이상</label
              >
            </div>
          </div>

          <!-- 우대 스킬 (선택 사항 + 복수 선택) -->
          <div class="form-group">
            <label class="form-label-2"
              >우대 스킬
              <span class="form-label-des">있으면 좋은 스킬 (선택)</span></label
            >
            <div class="skill-btn-group">
              <!-- TPL: 직무 선택 시 해당 직무별 우대 스킬 목록 출력 -->
              <!-- TPL:  (우대 스킬 버튼 반복) -->
              <label class="skill-btn">
                <input type="checkbox" name="skill_priorities" value="figma" />
                Figma
              </label>
              <label class="skill-btn">
                <input
                  type="checkbox"
                  name="skill_priorities"
                  value="data-analysis"
                />
                데이터 분석
              </label>
              <label class="skill-btn">
                <input
                  type="checkbox"
                  name="skill_priorities"
                  value="photoshop"
                />
                포토샵
              </label>
              <label class="skill-btn">
                <input
                  type="checkbox"
                  name="skill_priorities"
                  value="google-analytics"
                />
                Google Analytics
              </label>
            </div>
          </div>

          <!-- 보유 스킬 (필수 사항 + 복수 선택) -->
          <div class="form-group">
            <label class="form-label-2"
              >보유 스킬
              <span class="form-label-des">중복 선택 가능 (필수)</span></label
            >
            <div class="skill-btn-group">
              <!-- TPL: 직무 선택 시 해당 직무별 보유 스킬 목록 출력 -->
              <!-- TPL:  (보유 스킬 버튼 반복) -->
              <label class="skill-btn">
                <input type="checkbox" name="skill" value="excel" />
                엑셀
              </label>
              <label class="skill-btn">
                <input type="checkbox" name="skill" value="powerpoint" />
                파워포인트
              </label>
              <label class="skill-btn">
                <input type="checkbox" name="skill" value="sns-contents" />
                SNS 콘텐츠
              </label>
              <label class="skill-btn">
                <input type="checkbox" name="skill" value="copywriting" />
                카피라이팅
              </label>
              <label class="skill-btn">
                <input type="checkbox" name="skill" value="slack" />
                Slack
              </label>
              <label class="skill-btn">
                <input type="checkbox" name="skill" value="notion" />
                Notion
              </label>
              <label class="skill-btn">
                <input type="checkbox" name="skill" value="jira" />
                Jira
              </label>
              <label class="skill-btn">
                <input type="checkbox" name="skill" value="zoom" />
                Zoom
              </label>
            </div>
          </div>

          <button class="create-project-btn" type="submit" disabled>
            공고 등록하기
          </button>
        </section>

        <!-- 우측 사이드바 영역 -->
        <section class="project-form-right">
          <!-- 모집 인원 -->
          <div class="form-group">
            <label for="recruit-count" class="form-label-3">모집 인원</label>
            <input
              type="number"
              min="1"
              id="recruit-count"
              name="recruit_count"
              class="form-input"
              placeholder="예: 1명"
              required
            />
          </div>

          <!-- 보수 금액 -->
          <div class="form-group">
            <label for="pay-amount" class="form-label-3">보수 금액</label>
            <input
              type="number"
              min="0"
              id="pay-amount"
              name="compensation_amount"
              class="form-input"
              placeholder="예: 보수 금액 25,000원"
              required
            />
          </div>

          <!-- 모집 마감일 -->
          <div class="form-group">
            <label for="deadline-date" class="form-label-3">모집 마감일</label>
            <input
              type="date"
              id="deadline-date"
              name="deadline"
              class="form-input"
              placeholder="예: 2026.07.20"
              required
            />
          </div>

          <!-- 프로젝트 기간 -->
          <div class="form-group">
            <label for="project-period" class="form-label-3"
              >프로젝트 기간</label
            >
            <input
              type="text"
              id="project-period"
              class="form-input"
              name="duration"
              placeholder="예: 07.20 ~ 08.15"
              required
            />
          </div>

          <!-- 추가 사항 (선택 사항) -->
          <div class="form-card" id="additional-info">
            <p class="card-title">추가 사항</p>
            <textarea
              class="form-textarea"
              placeholder="추가적인 상세 업무/우대사항이 있다면 적어주세요"
            ></textarea>
          </div>

          <!-- 숨은 능력 등록 -->
          <div class="form-card" id="hidden-ability">
            <!-- 숨은 능력 모달에서 추가 시 hidden input에 저장 -->
            <input
              type="hidden"
              id="hidden-abilities-input"
              name="hidden_abilities"
              value="[]"
            />

            <p class="card-title">숨은 능력 등록</p>
            <p class="card-subtitle">매칭 기준 가중치 설정</p>
            <p class="card-des card-des--first">
              보유 스킬 외 숨은 능력을 추가로<br />
              등록하면 경력자들과 매칭률이 높아져요
            </p>
            <p class="card-des card-des--second">높은 매칭률을 유지하여</p>
            <p class="card-des badge-des">
              <span class="badge">
                <img
                  class="badge-img"
                  src="../../static/img/trophy.svg"
                  alt=""
                />
                <span class="badge-text">우수기업</span>
              </span>
              <span>선정을 노려볼까요?</span>
            </p>
            <button class="modal-open-btn" type="button" disabled>
              추가하기
            </button>
          </div>
        </section>
      </form>
    </main>

    <!-- 숨은 능력 모달 팝업 영역 -->
    <div class="modal-overlay">
      <div class="modal-box">
        <div class="modal-header">
          <!-- TPL: 현재 선택한 직무명을 타이틀 및 캡션에 반영 -->
          <p class="modal-title">숨은 능력 매칭 항목 추가_콘텐츠 기획</p>
          <p class="caption">
            콘텐츠 기획 직무와 관련된 숨은 능력을 선택하면 매칭 가중치에
            반영돼요
          </p>
        </div>

        <div class="divider"></div>

        <div class="modal-body">
          <!-- 숨은 능력 목록 -->
          <div class="hidden-ability-list">
            <!-- TPL: 현재 선택한 직무의 숨은 능력 아이템 목록 반복 -->
            <div class="hidden-ability-item">
              <button class="checkbox" type="button" data-checked="false">
                <img src="../../static/img/checkbox-blank.svg" alt="checkbox" />
              </button>
              <!-- TPL: 숨은 능력(번역 전) -->
              <div class="hidden-ability-original">맘카페 운영</div>
              <img
                class="right-arrow-img"
                src="../../static/img/right-arrow.svg"
                alt="right-arrow"
              />
              <div class="hidden-ability-translated">
                <img
                  class="green-icon"
                  src="../../static/img/ellipse-green.svg"
                />
                <!-- TPL: 숨은 능력 (번역 후) -->
                <span class="translated-text">커뮤니티 매니징</span>
              </div>
            </div>
            <div class="hidden-ability-item">
              <button class="checkbox" type="button" data-checked="false">
                <img src="../../static/img/checkbox-blank.svg" alt="checkbox" />
              </button>
              <div class="hidden-ability-original">블로그 공동 구매 운영</div>
              <img
                class="right-arrow-img"
                src="../../static/img/right-arrow.svg"
                alt="right-arrow"
              />
              <div class="hidden-ability-translated">
                <img
                  class="green-icon"
                  src="../../static/img/ellipse-green.svg"
                />
                <span class="translated-text">콘텐츠 기획 / SNS 마케팅</span>
              </div>
            </div>
            <div class="hidden-ability-item">
              <button class="checkbox" type="button" data-checked="false">
                <img src="../../static/img/checkbox-blank.svg" alt="checkbox" />
              </button>
              <div class="hidden-ability-original">학교 행사 기획 보조</div>
              <img
                class="right-arrow-img"
                src="../../static/img/right-arrow.svg"
                alt="right-arrow"
              />
              <div class="hidden-ability-translated">
                <img
                  class="green-icon"
                  src="../../static/img/ellipse-green.svg"
                />
                <span class="translated-text">프로젝트 운영 지원</span>
              </div>
            </div>
          </div>

          <div class="divider"></div>

          <!-- 매칭 가중치 -->
          <div class="matching-weight-group">
            <label class="matching-weight-label">매칭 가중치</label>
            <div class="option-btn-group">
              <!-- TPL: (매칭 가중치 버튼 반복) -->
              <label class="option-btn">
                <input
                  type="radio"
                  name="matching_weight"
                  value="LOW"
                  required
                />
                낮음
              </label>
              <label class="option-btn">
                <input
                  type="radio"
                  name="matching_weight"
                  value="MEDIUM"
                  required
                />
                보통
              </label>
              <label class="option-btn">
                <input
                  type="radio"
                  name="matching_weight"
                  value="HIGH"
                  required
                />
                높음
              </label>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button class="modal-close-btn" type="button">취소</button>
          <button class="hidden-ability-add-btn" type="button">추가하기</button>
        </div>
      </div>
    </div>
  </body>
</html>
