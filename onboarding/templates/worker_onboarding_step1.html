<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../static/css/colorpalette.css" />
    <link rel="stylesheet" href="../../static/css/global.css" />
    <link rel="stylesheet" href="../../static/css/worker_onboarding.css" />
    <title>worker onboarding step1</title>
  </head>
  <body>
    <header>
      <div class="header-logo">
        <img
          class="header-logo-img"
          src="../../static/img/logo.svg"
          alt="logo"
        />
        <div class="header-logo-text">
          <span class="logo-desc">당신의 두 번째 커리어 브릿지</span>
          <span class="logo-brand"
            ><span class="RE">RE</span><span class="colon">:</span>Bridge</span
          >
        </div>
      </div>
    </header>
    <main class="onboarding-main">
      <a class="back-btn" href="../../accounts/templates/login.html"
        >← 이전
        <div class="ellipse hidden"></div
      ></a>
      <div class="step-bar">
        <span class="step active"></span>
        <span class="step"></span>
        <span class="step"></span>
        <span class="step"></span>
      </div>
      <small class="step-tatus">1/4단계</small>
      <h3 class="step1-desc">희망하시는 직무를 선택해주세요</h3>
      <p class="select-desc">중복 선택 가능해요</p>
      <form method="post">
        <div class="career-wrap">
          <input type="radio" name="job-type" id="content" class="btn-hover">콘텐츠 기획</input>
          <input type="radio" name="job-type" id="data" class="btn-hover">데이터 분석</input>
          <input type="radio" name="job-type" id="design" class="btn-hover">디자인</input>
          <input type="radio" name="job-type" id="develop" class="btn-hover">개발</input>
        </div>
        <button type="submit" class="next-btn btn-hover">다음</button>
      </form>
    </main>
  </body>

  <script src="../../static/js/w_onboarding.js"></script>
</html>
