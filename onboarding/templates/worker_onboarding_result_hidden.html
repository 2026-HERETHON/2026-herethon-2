<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../static/css/colorpalette.css" />
    <link rel="stylesheet" href="../../static/css/global.css" />
    <link rel="stylesheet" href="../../static/css/worker_onboarding_result.css" />
    <title>worker onboarding step1</title>
  </head>
  <body>
    <header>
      <div class="header-logo">
        <img
          class="header-logo-img"
          src="../../static/img/logo.svg"
          alt="logo"
        />
        <div class="header-logo-text">
          <span class="logo-desc">당신의 두 번째 커리어 브릿지</span>
          <span class="logo-brand"
            ><span class="RE">RE</span><span class="colon">:</span>Bridge</span
          >
        </div>
      </div>
    </header>
    <main class="onboarding-main">
    
      <section>
        <div class="result-wrap">
          <div class="result-box">
            <img src="../../static/img/check-bold.svg">
          </div>
          <h2>분석이 끝났어요!</h2>
          <small>입력하신 공백기 활동을 <span class="hidden-skill-text">"숨은 능력"</span> 으로 번역했어요</small>
        </div>

        <article>
          <div class="hidden-skill">
            맘카페 운영
          </div>
          <i class="fa-solid fa-arrow-right-long"></i>
          <div class="matching-skill">
            <img class="ellipse" src="../../static/img/ellipse-green.svg">
            <p class="match-skill">커뮤니티 매니징</p>
          </div>
        </article>

        <article>
          <div class="hidden-skill">
          블로그 공동구매 운영
          </div>
          <img class="change-arrow" src="../../static/img/arrow-right-long.svg">
          <div class="matching-skill">
            <img class="ellipse" src="../../static/img/ellipse-green.svg">            <p class="match-skill">콘텐츠 기획 SNS 마케팅</p>
          </div>
        </article>

        <article>
          <div class="hidden-skill">
            학교 행사 기획 보조
          </div>
          <img  class="change-arrow" src="../../static/img/arrow-right-long.svg">
          <div class="matching-skill">
            <img class="ellipse" src="../../static/img/ellipse-green.svg">            <p class="match-skill">프로젝트 운영 지원</p>
          </div>
        </article>
      </section>

      
        <!--TPL: 매칭 결과 보러가기-->
        <div class="btn-wrap">
          <button
            type="submit"
            id="result-next-btn"
            class="next-btn btn-hover"
            disabled
          >
          내 매칭 결과 보러가기
          </button>
        </div>
      </form>
    </main>
  </body>

  <script src="../../static/js/w_onboarding.js"></script>
</html>
